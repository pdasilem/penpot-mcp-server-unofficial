services:
  penpot-mcp:
    image: ghcr.io/pdasilem/penpot-mcp-server-unofficial:2.18.1.8
    restart: unless-stopped
    depends_on:
      - penpot-frontend
    networks:
      - penpot
    env_file: ./penpot-mcp-server-unofficial/.env
    environment:
      PENPOT_MCP_SPOOL_DIR: /var/spool/penpot-mcp
    volumes:
      - penpot-mcp-spool:/var/spool/penpot-mcp
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256

volumes:
  penpot-mcp-spool:
